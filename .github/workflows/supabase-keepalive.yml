# Utrzymuje projekt Supabase w stanie aktywnym.
# Darmowe projekty Supabase są pauzowane po 7 dniach bez aktywności,
# więc dwa razy w tygodniu wykonujemy lekkie zapytanie do bazy.
#
# Adres projektu i klucz publiczny (publishable/anon) są czytane z access.js,
# żeby nie trzeba było ich trzymać w dwóch miejscach.
# Zapytanie przechodzi przez RLS jako anonim, więc niczego nie odczytuje
# (zwraca pustą listę), ale baza i tak je wykonuje, co liczy się jako aktywność.

name: Supabase keep-alive

on:
  schedule:
    - cron: '17 6 * * 1,4'   # poniedziałek i czwartek, 06:17 UTC
  workflow_dispatch:          # ręczne uruchomienie z zakładki Actions

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Odczytaj konfigurację z access.js
        run: |
          url=$(grep -oP "SUPABASE_URL\s*=\s*'\K[^']+" access.js)
          key=$(grep -oP "SUPABASE_ANON_KEY\s*=\s*'\K[^']+" access.js)
          if [ -z "$url" ] || [ -z "$key" ]; then
            echo "::error::Nie znaleziono SUPABASE_URL lub SUPABASE_ANON_KEY w access.js"
            exit 1
          fi
          echo "SUPABASE_URL=$url" >> "$GITHUB_ENV"
          echo "SUPABASE_ANON_KEY=$key" >> "$GITHUB_ENV"

      - name: Zapytanie do bazy
        run: |
          for attempt in 1 2 3; do
            status=$(curl -sS -o response.txt -w '%{http_code}' \
              "$SUPABASE_URL/rest/v1/planner_data?select=key&limit=1" \
              -H "apikey: $SUPABASE_ANON_KEY" \
              -H "Authorization: Bearer $SUPABASE_ANON_KEY") || status=000
            echo "Próba $attempt: HTTP $status"
            if [ "$status" = "200" ]; then
              echo "Baza odpowiedziała poprawnie."
              exit 0
            fi
            cat response.txt 2>/dev/null || true
            sleep 20
          done
          echo "::error::Baza nie odpowiedziała (HTTP $status). Sprawdź, czy projekt Supabase nie jest zapauzowany."
          exit 1
